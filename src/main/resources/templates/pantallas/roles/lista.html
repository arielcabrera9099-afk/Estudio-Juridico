<!doctype html>
<!-- Roles y permisos: lista con filtros y, desde ella, el ABM (RolesController). -->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::#contenido}, ~{::estilos})}">
<head>
  <title>Roles y permisos</title>
  <th:block th:fragment="estilos"></th:block>
</head>
<body>
<div id="contenido" class="gx-pantalla">
  <p th:replace="~{componentes/componentes :: ok}"></p>

  <header class="gx-encabezado">
    <h1><svg class="lucide" width="20" height="20"><use href="#i-shield-check"/></svg>Roles y permisos</h1>
    <p>Qué puede hacer cada perfil de usuario en el sistema</p>
  </header>

  <section class="gx-panel">
    <h2 class="gx-panel__titulo">Filtros</h2>
    <div class="gx-panel__cuerpo">
      <div class="gx-barra-resumen">
        <a class="gx-btn gx-btn--icono" th:href="@{/admin/roles/nuevo}"><svg class="lucide" width="16" height="16"><use href="#i-plus"/></svg>Agregar</a>
        <span class="gx-panel__nota" th:text="${#lists.size(filas)} == 1 ? '1 rol' : |${#lists.size(filas)} roles|">0 roles</span>
      </div>
      <form class="gx-campos gx-campos--filtros" method="get" th:action="@{/admin/roles}" data-filtros>
        <div class="gx-campo"><label for="f-texto">Buscar</label>
          <input id="f-texto" name="texto" th:value="${texto}" maxlength="80" autocomplete="off"
                 placeholder="Código, nombre o descripción"></div>
        <div class="gx-campo"><label for="f-estado">Estado</label>
          <select id="f-estado" name="estado">
            <option value="ACTIVOS" th:selected="${estado == 'ACTIVOS'}">ACTIVOS</option>
            <option value="INACTIVOS" th:selected="${estado == 'INACTIVOS'}">DADOS DE BAJA</option>
            <option value="TODOS" th:selected="${estado == 'TODOS'}">TODOS</option>
          </select></div>
        <div class="gx-campo gx-campo--boton">
          <div class="gx-botonera">
            <button type="submit" class="gx-btn gx-btn--icono"><svg class="lucide" width="16" height="16"><use href="#i-search"/></svg>Buscar</button>
            <a class="gx-btn gx-btn--secundario" th:href="@{/admin/roles}">Limpiar</a>
          </div>
        </div>
      </form>
    </div>
  </section>

  <section class="gx-panel gx-panel--grilla">
    <div class="gx-panel__cuerpo">
      <div class="gx-grilla-wrap">
        <table class="gx-grilla" id="grilla-roles" data-paginar="10">
          <thead><tr>
            <th class="gx-col-acciones"></th><th>Código</th><th>Nombre</th><th>Descripción</th>
            <th class="gx-num">Permisos</th><th class="gx-num">Usuarios activos</th><th>Estado</th>
          </tr></thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(filas)}"><td colspan="7" class="gx-grilla__vacio">No hay roles con esos filtros.</td></tr>
            <tr th:each="f : ${filas}" th:classappend="${!f.activo} ? 'gx-fila--peligro'">
              <td class="gx-col-acciones">
                <div class="gx-accion-grupo">
                  <button type="button" class="gx-accion-grupo__boton" aria-haspopup="true" aria-label="Acciones">
                    <svg class="lucide" width="16" height="16"><use href="#i-menu"/></svg></button>
                  <ul class="gx-accion-grupo__menu" hidden>
                    <li><a th:href="@{/admin/roles/{id}(id=${f.id})}"><svg class="lucide" width="15" height="15"><use href="#i-search"/></svg>Visualizar</a></li>
                    <li><a th:href="@{/admin/roles/{id}/editar(id=${f.id})}"><svg class="lucide" width="15" height="15"><use href="#i-pencil"/></svg>Modificar</a></li>
                    <li th:if="${f.activo and f.codigo != 'ADMINISTRADOR'}">
                      <form method="post" th:action="@{/admin/roles/{id}/baja(id=${f.id})}" data-confirmar-tipo="error"
                            data-confirmar-boton="Dar de baja"
                            th:attr="data-confirmar=|¿Dar de baja el rol ${f.nombre}? Ya no podrá asignarse a usuarios.|">
                        <button><svg class="lucide" width="15" height="15"><use href="#i-trash2"/></svg>Dar de baja</button>
                      </form>
                    </li>
                    <li th:unless="${f.activo}">
                      <form method="post" th:action="@{/admin/roles/{id}/reactivar(id=${f.id})}"
                            th:attr="data-confirmar=|¿Reactivar el rol ${f.nombre}?|">
                        <button><svg class="lucide" width="15" height="15"><use href="#i-rotate-ccw"/></svg>Reactivar</button>
                      </form>
                    </li>
                  </ul>
                </div>
              </td>
              <td><a class="gx-enlace" th:href="@{/admin/roles/{id}(id=${f.id})}" th:text="${f.codigo}">CODIGO</a></td>
              <td th:text="${f.nombre}">Nombre</td>
              <td th:text="${f.descripcion}">Descripción</td>
              <td class="gx-num" th:text="${f.permisos}">0</td>
              <td class="gx-num" th:text="${f.usuarios}">0</td>
              <td>
                <span th:if="${f.activo}" class="gx-etiqueta gx-etiqueta--exito">ACTIVO</span>
                <span th:unless="${f.activo}" class="gx-etiqueta gx-etiqueta--peligro">DADO DE BAJA</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</div>
</body>
</html>
