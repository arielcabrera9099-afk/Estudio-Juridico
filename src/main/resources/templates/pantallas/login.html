<!doctype html>
<!--
  Pantalla de acceso: tarjeta centrada con el logo (app.logo), "Acceso al Sistema", Usuario y Contraseña (con el botón
  para verla) e "Iniciar sesión". Envía a POST /login (Spring Security); los errores vuelven con ?error=motivo.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/img/favicon.png" th:href="@{/img/favicon.png}">
  <title>Acceso</title>
  <link rel="stylesheet" th:href="@{/css/base/base.css}">
  <link rel="stylesheet" th:href="@{/css/base/ajustes.css}">
  <link rel="stylesheet" th:href="@{/css/tokens/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/tema/tema.css}">
  <link rel="stylesheet" th:href="@{/css/tema/lex-nova.css}">
  <link rel="stylesheet" th:href="@{/css/componentes/login.css}">
</head>
<body>
<div class="login-page">
  <div class="gx-login">
    <div class="gx-login__marca">
      <img th:if="${!#strings.isEmpty(app.logo)}" th:src="@{${app.logo}}" class="gx-login__logo" alt="">
      <div class="gx-login__marca-texto">
        <strong th:text="${app.nombre}">LEX NOVA</strong>
        <span th:text="${app.subtitulo}">Gestión jurídica</span>
      </div>
    </div>
    <h1 class="gx-login__titulo">Acceso al Sistema</h1>

    <form id="form-login" th:action="@{/login}" method="post">
      <div class="gx-login__celda">
        <input class="gx-login__input" type="text" name="username" maxlength="30" autocomplete="username" autofocus
               required placeholder="Usuario" aria-label="Usuario">
      </div>
      <div class="gx-login__celda">
        <div class="gx-login__clave">
          <input class="gx-login__input" type="password" name="password" maxlength="64" autocomplete="current-password"
                 required id="login-clave" placeholder="Contraseña" aria-label="Contraseña">
          <button type="button" class="gx-login__ver" id="login-ver" aria-label="Mostrar la contraseña" title="Mostrar la contraseña">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
              <path data-tachado d="M3 3l18 18" hidden/>
            </svg>
          </button>
        </div>
      </div>
      <div class="gx-login__celda gx-login__celda--boton">
        <button type="submit" class="gx-login__boton" id="btn-ingresar">Iniciar sesión</button>
      </div>
    </form>

    <div th:if="${param.error}" role="alert" class="gx-login__mensaje" th:switch="${param.error[0]}">
      <span th:case="'bloqueado'" th:text="|Usuario bloqueado por intentos fallidos. Intente nuevamente en ${minutosBloqueo} minutos o pida a un administrador que lo desbloquee.|">Usuario bloqueado.</span>
      <span th:case="'inactivo'">El usuario está dado de baja. Consulte con un administrador.</span>
      <span th:case="*">Usuario o contraseña incorrectos.</span>
    </div>
    <div th:if="${param.salio}" role="status" class="gx-login__mensaje gx-login__mensaje--info">Cerró la sesión.</div>

    <p class="gx-login__pie" th:text="${app.nombre}">LEX NOVA</p>
  </div>
</div>
<script>
  (function () {
    var ver = document.getElementById('login-ver');
    var clave = document.getElementById('login-clave');
    ver.addEventListener('click', function () {
      var mostrar = clave.type === 'password';
      clave.type = mostrar ? 'text' : 'password';
      ver.querySelector('[data-tachado]').hidden = !mostrar;
      var t = mostrar ? 'Ocultar la contraseña' : 'Mostrar la contraseña';
      ver.setAttribute('aria-label', t);
      ver.title = t;
      clave.focus();
    });
    document.getElementById('form-login').addEventListener('submit', function () {
      var b = document.getElementById('btn-ingresar');
      b.disabled = true; b.textContent = 'Ingresando…';
    });
  })();
</script>
</body>
</html>
