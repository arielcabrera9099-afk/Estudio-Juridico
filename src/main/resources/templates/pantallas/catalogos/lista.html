<!doctype html>
<!--
  Catálogos: lista con filtros de una sección del menú (materias, juzgados, estados, tipos). El catálogo se elige en los
  filtros cuando la sección tiene más de uno. Columnas y filtros salen de la definición (Secciones / CatalogosController).
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::#contenido}, ~{::estilos})}">
<head>
  <title>Catálogos</title>
  <th:block th:fragment="estilos"></th:block>
</head>
<body>
<div id="contenido" class="gx-pantalla">
  <p th:replace="~{componentes/componentes :: ok}"></p>

  <header class="gx-encabezado">
    <h1><svg class="lucide" width="20" height="20"><use th:attr="href=|#i-${seccion.icono}|"/></svg><span th:text="${seccion.titulo}">Catálogo</span></h1>
    <p th:text="${seccion.subtitulo}">Descripción</p>
  </header>

  <section class="gx-panel">
    <h2 class="gx-panel__titulo">Filtros</h2>
    <div class="gx-panel__cuerpo">
      <div class="gx-barra-resumen">
        <a class="gx-btn gx-btn--icono" th:href="@{${agregarUrl}}"><svg class="lucide" width="16" height="16"><use href="#i-plus"/></svg>Agregar</a>
        <span class="gx-panel__nota" th:text="|${#lists.size(filas)} ${#lists.size(filas) == 1 ? 'registro' : 'registros'} · ${cat.plural}|">0 registros</span>
      </div>
      <form class="gx-campos gx-campos--filtros" method="get" th:action="@{/admin/{s}(s=${seccion.clave})}" data-filtros>
        <div class="gx-campo" th:if="${seccion.catalogos.size() > 1}"><label for="f-catalogo">Catálogo</label>
          <select id="f-catalogo" name="catalogo">
            <option th:each="e : ${seccion.catalogos}" th:value="${e.key}" th:text="${#strings.toUpperCase(e.value.plural)}"
                    th:selected="${e.key == cat.tabla}">Catálogo</option>
          </select></div>
        <input th:unless="${seccion.catalogos.size() > 1}" type="hidden" name="catalogo" th:value="${cat.tabla}">
        <div class="gx-campo"><label for="f-texto">Buscar</label>
          <input id="f-texto" name="texto" th:value="${texto}" maxlength="80" autocomplete="off"
                 th:placeholder="${cat.conCodigo} ? 'Código o nombre' : 'Nombre'"></div>
        <div class="gx-campo" th:each="campo : ${cat.campos}" th:if="${campo.filtro}">
          <label th:for="|f-${campo.columna}|" th:text="${campo.etiqueta}">Filtro</label>
          <select th:id="|f-${campo.columna}|" th:name="|f_${campo.columna}|">
            <option value="">TODOS</option>
            <option th:each="o : ${opcionesFiltro[campo.columna]}" th:value="${o.id}" th:text="${#strings.toUpperCase(o.texto)}"
                    th:selected="${filtros[campo.columna] == o.id}">Opción</option>
          </select></div>
        <div class="gx-campo"><label for="f-estado">Estado</label>
          <select id="f-estado" name="estado">
            <option value="ACTIVOS" th:selected="${estado == 'ACTIVOS'}">ACTIVOS</option>
            <option value="INACTIVOS" th:selected="${estado == 'INACTIVOS'}">DADOS DE BAJA</option>
            <option value="TODOS" th:selected="${estado == 'TODOS'}">TODOS</option>
          </select></div>
        <div class="gx-campo gx-campo--boton">
          <div class="gx-botonera">
            <a class="gx-btn gx-btn--secundario" th:href="@{/admin/{s}(s=${seccion.clave},catalogo=${cat.tabla})}">Limpiar</a>
          </div>
        </div>
      </form>
      <p class="gx-panel__nota" th:if="${cat.descripcion != null}" th:text="${cat.descripcion}">Nota</p>
    </div>
  </section>

  <section class="gx-panel gx-panel--grilla">
    <div class="gx-panel__cuerpo">
      <div class="gx-grilla-wrap">
        <table class="gx-grilla" id="grilla-catalogo" data-paginar="10"
               th:with="columnas=${#lists.size(cat.campos.?[enLista]) + (cat.conCodigo ? 3 : 2)}">
          <thead><tr>
            <th class="gx-col-acciones"></th>
            <th th:if="${cat.conCodigo}">Código</th>
            <th th:each="campo : ${cat.campos}" th:if="${campo.enLista}" th:text="${campo.etiqueta}"
                th:classappend="${campo.tipoNombre == 'ENTERO'} ? 'gx-num'">Campo</th>
            <th>Estado</th>
          </tr></thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(filas)}"><td th:colspan="${columnas}" class="gx-grilla__vacio">No hay registros con esos filtros.</td></tr>
            <tr th:each="f : ${filas}" th:classappend="${!f.activo} ? 'gx-fila--peligro'">
              <td class="gx-col-acciones">
                <div class="gx-accion-grupo">
                  <button type="button" class="gx-accion-grupo__boton" aria-haspopup="true" aria-label="Acciones">
                    <svg class="lucide" width="16" height="16"><use href="#i-menu"/></svg></button>
                  <ul class="gx-accion-grupo__menu" hidden>
                    <li><a th:href="@{/admin/{s}/{c}/{id}(s=${seccion.clave},c=${cat.tabla},id=${f.id})}"><svg class="lucide" width="15" height="15"><use href="#i-search"/></svg>Visualizar</a></li>
                    <li><a th:href="@{/admin/{s}/{c}/{id}/editar(s=${seccion.clave},c=${cat.tabla},id=${f.id})}"><svg class="lucide" width="15" height="15"><use href="#i-pencil"/></svg>Modificar</a></li>
                    <li th:if="${f.activo}">
                      <form method="post" th:action="@{/admin/{s}/{c}/{id}/baja(s=${seccion.clave},c=${cat.tabla},id=${f.id})}"
                            data-confirmar-tipo="error" data-confirmar-boton="Dar de baja"
                            th:attr="data-confirmar=|¿Dar de baja ${cat.conArticulo} ${f.nombre}? Ya no se ofrecerá en las altas.|">
                        <button><svg class="lucide" width="15" height="15"><use href="#i-trash2"/></svg>Dar de baja</button>
                      </form>
                    </li>
                    <li th:unless="${f.activo}">
                      <form method="post" th:action="@{/admin/{s}/{c}/{id}/reactivar(s=${seccion.clave},c=${cat.tabla},id=${f.id})}"
                            th:attr="data-confirmar=|¿Reactivar ${cat.conArticulo} ${f.nombre}?|">
                        <button><svg class="lucide" width="15" height="15"><use href="#i-rotate-ccw"/></svg>Reactivar</button>
                      </form>
                    </li>
                  </ul>
                </div>
              </td>
              <td th:if="${cat.conCodigo}"><span th:text="${f.codigo}">CODIGO</span></td>
              <td th:each="campo : ${cat.campos}" th:if="${campo.enLista}" th:with="v=${f[campo.columna]}"
                  th:classappend="${campo.tipoNombre == 'ENTERO'} ? 'gx-num'">
                <th:block th:switch="${campo.tipoNombre}">
                  <span th:case="'REFERENCIA'" th:text="${f[campo.columna + '__texto']}">Referencia</span>
                  <span th:case="'SINO'" th:text="${v} ? 'Sí' : 'No'">No</span>
                  <span th:case="'OPCIONES'"><span class="lx-muestra" th:style="|background: var(--${v})|"></span><span th:text="${campo.textoDe(v)}">Opción</span></span>
                  <th:block th:case="*">
                    <span th:if="${campo.columna == 'nombre' and !cat.conCodigo}" th:text="${v}">Nombre</span>
                    <span th:unless="${campo.columna == 'nombre' and !cat.conCodigo}" th:text="${v}">Valor</span>
                  </th:block>
                </th:block>
              </td>
              <td>
                <span th:if="${f.activo}" class="gx-etiqueta gx-etiqueta--exito">ACTIVO</span>
                <span th:unless="${f.activo}" class="gx-etiqueta gx-etiqueta--peligro">DADO DE BAJA</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</div>
</body>
</html>
